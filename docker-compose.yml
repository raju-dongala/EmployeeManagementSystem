services:

  discovery-server:
    build:
      context: ./discovery-server
    image: discovery-server:1.0
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - spring-microservices-network

  employee-service:
    build:
      context: ./employee-service
    image: employee-service:1.0
    container_name: employee-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-server
    networks:
      - spring-microservices-network

  department-service:
    build:
      context: ./department-service
    image: department-service:1.0
    container_name: department-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-server
    networks:
      - spring-microservices-network

  api-gateway:
    build:
      context: ./api-gateway
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-server
      - employee-service
      - department-service
    networks:
      - spring-microservices-network

networks:
  spring-microservices-network:
    driver: bridge