services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - spring-microservices-network

  discovery-server:
    image: discovery-server:1.0
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - spring-microservices-network

  employee-service:
    image: employee-service:1.0
    container_name: employee-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: aws
    networks:
      - spring-microservices-network
    depends_on:
      - discovery-server
      - mysql

  department-service:
    image: department-service:1.0
    container_name: department-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: aws
    networks:
      - spring-microservices-network
    depends_on:
      - discovery-server
      - mysql

  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - spring-microservices-network
    depends_on:
      - discovery-server
      - employee-service
      - department-service

networks:
  spring-microservices-network:
    driver: bridge

volumes:
  mysql-data: