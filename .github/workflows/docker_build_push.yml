name: Build and Publish Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the microservice name"
        required: true
        default: employee-service
        type: choice
        options:
          - employee-service
          - discovery-server
          - department-service
          - api-gateway
    

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java application with Maven
        run: mvn clean package -DskipTests
        working-directory: ./${{ inputs.environment }}

      - name: Set lowercase image name
        id: image
        run: echo "tag=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.environment }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
